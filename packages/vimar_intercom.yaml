# =============================================================================
#  Vimar Intercom — esempio di package per Home Assistant
#
#  Copialo in `config/packages/` (serve `packages: !include_dir_named packages/`
#  sotto `homeassistant:` in configuration.yaml) e adatta i nomi: gli entity_id
#  qui sotto sono quelli di un'installazione con l'integrazione appena aggiunta,
#  ma cambiano in base al nome che hai dato al dispositivo e all'area.
#  Cercali in Strumenti per sviluppatori → Stati filtrando per "vimar".
#
#  Da adattare di sicuro:
#    - notify.mobile_app_IL_TUO_TELEFONO   (Impostazioni → Companion App)
#    - gli entity_id di event/binary_sensor se il tuo differisce
# =============================================================================

automation:
  # --- Squillo → notifica sul telefono ---------------------------------------
  - id: vimar_intercom_squillo_notifica
    alias: "Citofono - Squillo → notifica"
    description: >-
      Allo squillo notifica con la foto di chi c'è (anteprima dello squillo),
      "Rispondi" (risponde e apre la camera) e "Apri" (portone).
    mode: single
    max_exceeded: silent
    trigger:
      # L'entità `event` cambia stato (timestamp) a ogni pressione del campanello.
      - platform: state
        entity_id: event.vimar_intercom_doorbell
        not_from: [unavailable, unknown]
    action:
      # L'anteprima (early media) parte allo squillo: ~3 s per una foto esposta bene.
      - delay: "00:00:03"
      - action: notify.mobile_app_IL_TUO_TELEFONO
        data:
          title: "🔔 Qualcuno al citofono"
          message: "Squillo delle {{ now().strftime('%H:%M') }}."
          data:
            image: "/api/camera_proxy/camera.vimar_intercom_intercom"   # chi c'è, già nella notifica
            push:
              interruption-level: time-sensitive
            actions:
              - action: VIMAR_RISPONDI
                title: "Rispondi (solo video)"   # HA non trasmette la tua voce
                uri: "entityId:camera.vimar_intercom_intercom"   # apre la camera nell'app
              - action: VIMAR_APRI
                title: "Apri"
                destructive: true
                authenticationRequired: true   # Face ID / codice: SOLO iOS, su Android no

  # --- Pulsante "Rispondi" → risponde (poi la camera mostra il video) ----------
  - id: vimar_intercom_notifica_rispondi
    alias: "Citofono - Notifica → rispondi"
    mode: single
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: VIMAR_RISPONDI
    action:
      - action: vimar_intercom.answer

  # --- Pulsante "Apri" → apre il portone, solo entro 3 minuti dallo squillo ----
  - id: vimar_intercom_notifica_apri
    alias: "Citofono - Notifica → apri"
    mode: single
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: VIMAR_APRI
    condition:
      # Una notifica vecchia di ore non deve aprire la porta.
      - "{{ states('event.vimar_intercom_doorbell') not in ['unknown', 'unavailable']
            and now() - as_datetime(states('event.vimar_intercom_doorbell')) < timedelta(minutes=3) }}"
    action:
      - action: lock.unlock
        target:
          entity_id: lock.vimar_intercom_serratura

  # --- Riaggancio di sicurezza ------------------------------------------------
  # Rete di protezione: chiude una chiamata rimasta aperta (automazione
  # interrotta, riavvio di HA, pulsante premuto per sbaglio).
  - id: vimar_intercom_hangup_sicurezza
    alias: "Citofono - Riaggancio di sicurezza"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.vimar_intercom_intercom_in_call
        to: "on"
        for: "00:02:00"
    action:
      - action: vimar_intercom.hangup

# =============================================================================
#  FOTO DI CHI SUONA
#
#  Non serve un'automazione: nelle opzioni dell'integrazione imposta "Cartella
#  foto squillo" (es. /config/media/citofono). A ogni squillo il plugin salva
#  squillo_AAAAMMGG_HHMMSS.jpg e ultimo_squillo.jpg dall'anteprima.
#  Non usare /config/www: è servita su /local senza login (il plugin la rifiuta).
#
#  NON aggiungere una `camera: platform: ffmpeg` puntata su
#  /api/vimar_intercom/av: la piattaforma ffmpeg sonda l'input quando viene
#  caricata, l'endpoint senza una chiamata attiva tiene la connessione aperta
#  senza mandare dati, e Home Assistant smette di rispondere finché la sonda
#  non scade (circa un minuto, provato sul campo).
# =============================================================================
