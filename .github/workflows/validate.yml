name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Le versioni di Python che Home Assistant usa oggi.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      # I test girano senza Home Assistant installato: conftest.py fornisce gli
      # stub. I test marcati `live` (che richiedono il citofono in rete) sono
      # esclusi dal marker in pyproject.toml.
      - run: python -m pytest tests

  media-browser:
    # A richiesta (workflow_dispatch): media vero (ffmpeg, aiohttp) e la card in
    # Chromium (Playwright). Non a ogni push: minuti e dipendenze pesanti.
    name: pytest -m media / -m browser
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt aiohttp playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests -m media
      - run: python -m pytest tests -m browser
