name: PR text

# The changelog is written at release time from the "Changelog:" lines of the merged PRs
# (CONTRIBUTING.md). This checks that every PR has them, and that they are well formed.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  changelog-lines:
    name: Changelog lines
    runs-on: ubuntu-latest
    # In the merge queue there is no PR text to read: the check already passed on the PR.
    # Dependabot's PRs have none either (the release tool puts them under Other changes).
    # A skipped job counts as passed for the required check.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The body goes through an environment variable, never into the script itself.
      - run: python tools/pr_changelog.py
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
