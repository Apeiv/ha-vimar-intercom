# ─────────────────────────────────────────────────────────────────────────────
# Vimar Intercom — card Lovelace "citofono base"
# Video del pianerottolo + pulsanti Rispondi / Apri porta / Riaggancia.
#
# Il video appare durante una chiamata e già durante lo squillo (anteprima).
# APRIRE LO STREAM CHIAMA LA TARGA (`camera_target`): per questo la card usa
# `camera_view: auto` e non `live`, che chiamerebbe a ogni apertura della
# dashboard. Per video, voce e apri in una card sola c'è
# `custom:vimar-intercom-card` (vedi README): non chiama finché non premi.
#
# NB: questa card non fa audio bidirezionale; per parlare serve la card custom.
#
# Come si usa: Dashboard → Modifica → aggiungi card → "Manuale" → incolla.
# Aggiusta l'entity della camera se sul tuo HA ha un nome diverso
# (cerca in Strumenti sviluppatore → Stati una entità che inizia con `camera.` e
#  contiene "vimar"/"intercom").
# ─────────────────────────────────────────────────────────────────────────────
type: vertical-stack
cards:
  # Video del citofono: durante lo squillo e la chiamata mostra il pianerottolo.
  # Toccarlo da fermo apre il live e chiama la targa.
  - type: picture-entity
    entity: camera.vimar_intercom_intercom
    camera_view: auto
    show_name: false
    show_state: false

  # Stato squillo/chiamata (facoltativo ma utile)
  - type: entities
    entities:
      # Gli entity_id cambiano con il nome del dispositivo e con l'area: se HA
      # dice "entità non trovata", cercali in Strumenti per sviluppatori → Stati
      # filtrando per "vimar".
      - entity: sensor.vimar_intercom_intercom_stato   # idle / ringing / in_call
        name: Stato citofono
      - entity: sensor.vimar_intercom_intercom_ultimo_chiamante
        name: Ultimo chiamante

  # Pulsanti: usano i SERVIZI dell'integrazione (indipendenti dal nome entità)
  - type: horizontal-stack
    cards:
      - type: button
        name: Rispondi
        icon: mdi:phone
        tap_action:
          action: call-service
          service: vimar_intercom.answer
      - type: button
        name: Apri porta
        icon: mdi:door-open
        tap_action:
          action: call-service
          service: vimar_intercom.open_door
      - type: button
        name: Riaggancia
        icon: mdi:phone-hangup
        tap_action:
          action: call-service
          service: vimar_intercom.hangup
